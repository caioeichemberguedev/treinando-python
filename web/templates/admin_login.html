{% extends "base.html" %}

{% block titulo %}Área adm — Jogo de Futebol{% endblock %}

{% block conteudo %}
    <h1>Área adm</h1>

    {% if erro %}
        <p role="alert">{{ erro }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('entrar_admin') }}">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password">
        <button type="submit" class="botao">Entrar</button>
    </form>
{% endblock %}
