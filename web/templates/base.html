<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Jogo de Futebol{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/estilo.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('inicio') }}">Jogo de Futebol</a>
            <a href="{{ url_for('tela_saves') }}">Carreiras salvas</a>
            <a href="{{ url_for('tela_equipes') }}">Editar equipes</a>
            <a href="{{ url_for('tela_historico') }}">Histórico</a>
        </nav>
    </header>

    {% if save_pendente() %}
    <section class="aviso-save-travado" role="alert">
        <p>{{ mensagem_save_travado }}</p>
        <p>Seu progresso continua na memória do servidor — não feche o servidor antes de salvar.</p>
        <form method="post" action="{{ url_for('salvar_carreira_de_novo') }}">
            <button type="submit">Tentar salvar de novo</button>
        </form>
    </section>
    {% endif %}

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Simulador de Copa</p>
    </footer>
</body>
</html>
