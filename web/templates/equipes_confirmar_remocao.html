{% extends "base.html" %}

{% block titulo %}Remover equipe — Jogo de Futebol{% endblock %}

{% block conteudo %}
    <h1>Remover equipe</h1>
    <p>
        Tem certeza que deseja remover <strong>{{ nome_equipe }}</strong> de
        {{ campeonato }}? Essa ação não pode ser desfeita.
    </p>
    <form method="post" action="{{ url_for('remover_equipe', campeonato=campeonato, nome_equipe=nome_equipe) }}">
        <button type="submit" class="botao">Confirmar remoção</button>
    </form>
    <p><a href="{{ url_for('tela_equipes_campeonato', campeonato=campeonato) }}">Cancelar</a></p>
{% endblock %}
